<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🚀 Project Dashboard</h1>
        <p>Manage and track your projects efficiently</p>
    </header>
    
    <main>
        <div class="dashboard-container">
            <div class="card">
                <h2>📊 Overview</h2>
                <p>Welcome to your project dashboard! This is a starting template for managing your projects.</p>
            </div>
            
            <div class="card">
                <h2>📁 Projects</h2>
                <p>Your projects will be displayed here.</p>
            </div>
            
            <div class="card">
                <h2>⚙️ Settings</h2>
                <p>Configuration and preferences.</p>
            </div>
        </div>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
